<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rig Lab — Rabbit Study</title>
  <meta name="description" content="Contact sheet of the rabbit rig: the sitting pose and the gallop cycle frame by frame, with bones.">
  <style>
    :root { --ink: #000; --paper: #fff; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink); font: 11px/1.4 ui-monospace, Menlo, monospace; }
    .sheet { display: grid; grid-template-columns: repeat(var(--cols, 8), minmax(0, 1fr)); gap: 6px; }
    figure { margin: 0; }
    figure canvas { width: 100%; display: block; outline: 1px solid rgba(0,0,0,.1); }
    figcaption { padding: 2px 0 8px; }
    h2 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }
    #view { position: absolute; left: -9999px; top: 0; width: 320px; height: 200px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <p>Rig lab · <code>?style=contour|pixel|sky|gradient&amp;frames=16&amp;rig=1&amp;yaw=0</code></p>
  <h2>Sit</h2>
  <div class="sheet" id="sit" style="--cols:4"></div>
  <h2>Gallop</h2>
  <div class="sheet" id="gallop"></div>
  <canvas id="view"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { solve, SIT, LOOK_DOWN, gallopPose, BONES } from './js/rig.js';
    import { SdfView } from './js/sdf.js';
    import { Ps1View } from './js/ps1.js';

    const q = new URLSearchParams(location.search);
    const style = q.get('style') || 'contour';
    const profile = ['sky', 'gradient'].includes(style) ? 'soft' : 'classic';
    const frames = Math.max(1, Math.min(48, +(q.get('frames') || 16)));
    document.getElementById('gallop').style.setProperty('--cols', Math.max(1, Math.min(8, +(q.get('cols') || 8))));
    const showRig = q.get('rig') !== '0';
    const canvas = document.getElementById('view');
    const view = style === 'ps1' ? new Ps1View(canvas, { pixelSize: 2 })
      : new SdfView(canvas, { style, bg: style === 'sky' ? '#14a3e4' : '#ffffff', palette: +(q.get('palette') || 0) });
    view.resize();
    const v = new THREE.Vector3();

    function tile(parent, J, label, yaw = +(q.get('yaw') || 0), target = [0.05, 0.38, 0], dist = 3.1, hole = null) {
      if (profile === 'soft') { target = [target[0], 0.48, target[2]]; dist = 3.6; }
      const cam = view.camera;
      const y = yaw * Math.PI / 180, p = 4 * Math.PI / 180;
      cam.position.set(target[0] + Math.sin(y) * Math.cos(p) * dist, target[1] + Math.sin(p) * dist, target[2] + Math.cos(y) * Math.cos(p) * dist);
      cam.lookAt(...target);
      cam.updateMatrixWorld();
      view.update(J, hole);
      view.render();
      const fig = document.createElement('figure');
      const c = document.createElement('canvas');
      c.width = 640; c.height = 400;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      g.drawImage(canvas, 0, 0, c.width, c.height);
      if (showRig) {
        const s = c.width / 320;
        const proj = (pt) => { v.set(...pt).project(cam); return [(v.x * .5 + .5) * c.width, (-v.y * .5 + .5) * c.height]; };
        g.lineWidth = 1.5 * s / 2;
        for (const [a, b] of BONES) {
          g.strokeStyle = /F/.test(a + b) ? 'rgba(255,61,0,.4)' : '#ff3d00';
          const pa = proj(J[a]), pb = proj(J[b]);
          g.beginPath(); g.moveTo(...pa); g.lineTo(...pb); g.stroke();
        }
        const a = proj([-3, 0, 0]), b = proj([3, 0, 0]);
        g.strokeStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
      }
      fig.append(c);
      const cap = document.createElement('figcaption');
      cap.textContent = label;
      fig.append(cap);
      parent.append(fig);
    }

    const sit = document.getElementById('sit');
    for (const [name, pose] of [['Alert', SIT], ['Inspect', LOOK_DOWN]]) {
      for (const yaw of [0, 35, 90, -40]) tile(sit, solve(pose, profile), `${name} · yaw ${yaw}`, yaw, [0.25, 0.35, 0], 2.8, [0.66, 0.06, 0.13]);
    }
    const gallop = document.getElementById('gallop');
    for (let i = 0; i < frames; i++) {
      const t = i / frames;
      const pose = gallopPose(t);
      pose.x = 0;
      tile(gallop, solve(pose, profile), `t ${t.toFixed(3)}`);
    }
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
